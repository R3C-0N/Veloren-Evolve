[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.x86_64-pc-windows-gnu]
rustflags = [
    # Required for mimalloc
    "-C",
    "link-arg=-lpsapi",
]

# Windows MSVC, la cible par défaut sur Windows. `link.exe` relie voxygen
# (~600 crates, un exécutable de plusieurs centaines de Mo) en dizaines de
# secondes ; `rust-lld`, livré avec le toolchain Rust et donc déjà installé,
# fait le même travail plusieurs fois plus vite. L'édition de liens domine le
# build incrémental : après une ligne changée dans voxygen, c'est presque tout
# ce que fait `cargo build`.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Clever way to get workspace dir, from https://github.com/rust-lang/cargo/issues/3946#issuecomment-973132993
[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }

[alias]
# tools
cmd-doc-gen = "run --features=bin_cmd_doc_gen --bin cmd_doc_gen"
csv-export = "run --manifest-path common/Cargo.toml --features=bin_csv --bin csv_export"
csv-import = "run --manifest-path common/Cargo.toml --features=bin_csv --bin csv_import"
find_unused = "run --manifest-path common/Cargo.toml --bin find_unused"
dot-recipes = "run --manifest-path common/Cargo.toml --features=bin_graphviz --bin recipe_graphviz"
dot-skills = "run --manifest-path common/Cargo.toml --features=bin_graphviz --bin skill_graphviz"
img-export = "run --manifest-path voxygen/Cargo.toml --features=bin_img-export --bin img-export"
# server-cli
server = "run --bin veloren-server-cli"
test-server = "run --bin veloren-server-cli --no-default-features --features simd"
tracy-server = "run --bin veloren-server-cli --features tracy,simd --profile no_overflow"
tracy-server-debuginfo = "run --bin veloren-server-cli --features tracy,simd --profile no_overflow_debuginfo"
tracy-server-releasedebuginfo = "run --bin veloren-server-cli --features tracy,simd --profile releasedebuginfo"
tracy-test-server = "run --bin veloren-server-cli --no-default-features --features tracy,simd --profile no_overflow"
# voxygen
# Le build de développement conseillé : profil `no_overflow` et jeu de features
# réduit à ce qu'il faut pour jouer en solo. Face aux features par défaut cela
# retire les greffons (wasmtime + cranelift, 95 crates à eux seuls), Discord et
# la boîte de dialogue native du gestionnaire de panique — 104 crates de moins,
# pour un client qui se joue exactement pareil. `egui-ui` reste : il ne coûte
# presque rien à compiler, et le pilote de la compétence `run-veloren-evolve`
# lit sa ligne de journal pour savoir que le démarrage est fini.
# Si le SDK Vulkan est installé, retirer `shaderc-from-source` de ces deux
# alias fait tomber la compilation C++ de shaderc (voir COMPILATION.md).
fast-voxygen = "build --profile no_overflow --bin veloren-voxygen --no-default-features --features singleplayer,simd,hot-reloading,shaderc-from-source,egui-ui"
fast-run = "run --profile no_overflow --bin veloren-voxygen --no-default-features --features singleplayer,simd,hot-reloading,shaderc-from-source,egui-ui --"
test-voxygen = "run --bin veloren-voxygen --no-default-features --features simd,egui-ui,shaderc-from-source,hot-reloading"
tracy-voxygen = "run --bin veloren-voxygen --no-default-features --features tracy,simd,egui-ui,shaderc-from-source --profile no_overflow"
dbg-voxygen = "run --bin veloren-voxygen --profile debuginfo"
# misc
swarm = "run --bin swarm --features client/bin_bot,client/tick_network --"
ci-clippy = "clippy --all-targets --locked --features=bin_cmd_doc_gen,bin_compression,bin_csv,bin_graphviz,bin_bot,bin_asset_migrate,bin,stat"
ci-clippy2 = "clippy -p veloren-voxygen --locked --no-default-features --features=default-publish"
